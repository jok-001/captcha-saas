{% extends "base.html" %}
{% block title %}注册 - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="auth-logo">◈</div>
<div class="brand center">{{ APP_NAME }}</div>
<div class="brand-sub center">创建账号，立即领取 {{ SIGNUP_BONUS }} 积分体验</div>

<form method="post">
  <label>用户名</label>
  <input name="username" placeholder="请设置用户名" autofocus required minlength="3">

  <label>密码</label>
  <input name="password" type="password" placeholder="请设置密码（至少6位）" required minlength="6">

  <label>确认密码</label>
  <input name="confirm" type="password" placeholder="再次输入密码" required minlength="6">

  <button type="submit">注 册</button>
</form>

<div class="auth-footer">
  已有账号？<a href="{{ url_for('web.login') }}">直接登录</a>
</div>
{% endblock %}
