{% extends "base.html" %}
{% set active='records' %}
{% set page_title = '使用记录' %}
{% block content %}
<div class="card" style="max-width:600px">
  <h3 style="margin-top:0">这个页面已经合并了</h3>
  <p class="muted" style="line-height:1.75">
    「使用情况」和「积分流水」已合并为<strong>「使用记录」</strong>：打码明细和积分变动现在在同一张表里，
    可以按类型、结果、关键词、日期统一筛选，翻页参数也会自动带上筛选条件。
  </p>
  <p class="muted small">从旧书签进来也没关系，点下面的按钮即可。</p>
  <a class="btn mt" href="{{ url_for('web.records') }}">前往使用记录 →</a>
</div>
{% endblock %}
