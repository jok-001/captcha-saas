{% extends "base.html" %}
{% set active='pricing' %}
{% block content %}

<div class="card">
  <form method="post" id="pricingForm" class="row" style="align-items:flex-end;gap:12px;flex-wrap:nowrap">
    <div style="min-width:180px">
      <label>类型名</label>
      <input name="type" id="pType" placeholder="如 huya_v3" required>
    </div>
    <div style="min-width:120px">
      <label>积分 / 次</label>
      <input name="points" id="pPoints" type="number" placeholder="0" required>
    </div>
    <div style="min-width:200px;flex:1">
      <label>说明</label>
      <input name="note" id="pNote" placeholder="选填">
    </div>
    <div style="display:flex;align-items:center;height:42px;margin-left:6px">
      <label style="display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap">
        <input type="checkbox" name="enabled" id="pEnabled" style="width:auto" checked> 启用
      </label>
    </div>
    <div style="margin-left:auto">
      <button>保存</button>
    </div>
    <div>
      <button type="button" class="btn btn-ghost" id="resetBtn">清空</button>
    </div>
  </form>
</div>

<div class="card">
  <h3 style="margin:0 0 12px">当前定价</h3>
  <table>
    <tr><th>类型</th><th>积分/次</th><th>状态</th><th>说明</th><th>操作</th></tr>
    {% for p in pricing %}
    <tr>
      <td><code>{{ p.type }}</code></td>
      <td>{{ p.points }}</td>
      <td>{% if p.enabled %}<span class="pill pill-on">已接入</span>{% else %}<span class="pill pill-off">停用</span>{% endif %}</td>
      <td class="muted">{{ p.note or '—' }}</td>
      <td>
        <div class="row" style="gap:6px;flex-wrap:nowrap">
          <button class="btn btn-ghost btn-sm" onclick='editPrice({{ p|tojson }})'>编辑</button>
          <form method="post" action="{{ url_for('admin.pricing_delete') }}" style="display:inline"
                onsubmit="return confirm('确定删除类型 {{ p.type }} ？\n删除后该类型 API 调用将返回未知类型。');">
            <input type="hidden" name="type" value="{{ p.type }}">
            <button class="btn btn-danger btn-sm">删除</button>
          </form>
        </div>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>

<script>
document.getElementById('resetBtn').addEventListener('click', function(){
  document.getElementById('pType').value='';
  document.getElementById('pType').removeAttribute('readonly');
  document.getElementById('pPoints').value='';
  document.getElementById('pNote').value='';
  document.getElementById('pEnabled').checked=true;
});
function editPrice(p){
  document.getElementById('pType').value=p.type;
  document.getElementById('pType').setAttribute('readonly','readonly');
  document.getElementById('pPoints').value=p.points;
  document.getElementById('pNote').value=p.note||'';
  document.getElementById('pEnabled').checked=!!p.enabled;
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
{% endblock %}
